<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Voice Notes</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
  <script src="config.js"></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="header-text">
        <h1>Voice Notes</h1>
        <p class="subtitle">Record a voice note for your post</p>
      </div>
      <span id="modeBadge" class="badge" aria-live="polite">Demo mode</span>
    </header>

    <section class="card recorder" id="recorderSection" aria-labelledby="recorder-heading">
      <h2 id="recorder-heading" class="sr-only">Recorder</h2>

      <div class="status-row">
        <div id="recIndicator" class="rec-dot" hidden aria-hidden="true"></div>
        <span id="timer" class="timer" role="timer" aria-live="off">0:00</span>
        <span id="pausedState" class="paused-state" role="status" hidden>Paused</span>
        <span id="maxHint" class="hint">Max 3:00</span>
      </div>

      <div class="waveform" id="waveform" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <audio id="preview" controls class="preview" hidden aria-label="Listen back to your recording"></audio>

      <div class="form-row">
        <label for="displayName">Your name <span class="req">*</span></label>
        <input id="displayName" type="text" maxlength="60" placeholder="e.g. Ana" autocomplete="name" required />
      </div>
      <div class="form-row">
        <label for="noteTitle">Title <span class="optional">(optional)</span></label>
        <input id="noteTitle" type="text" maxlength="80" placeholder="e.g. Week 2 reflection" />
      </div>

      <div class="actions" id="actionsIdle">
        <button type="button" id="btnRecord" class="btn btn-primary">
          <span class="btn-icon" aria-hidden="true">●</span> Record
        </button>
      </div>
      <div class="actions" id="actionsRecording" hidden>
        <button type="button" id="btnPause" class="btn btn-primary" aria-label="Pause recording" hidden>
          <span class="btn-icon" aria-hidden="true">❚❚</span> <span id="pauseLabel">Pause</span>
        </button>
        <button type="button" id="btnStop" class="btn btn-danger">
          <span class="btn-icon" aria-hidden="true">■</span> Stop
        </button>
      </div>
      <div class="actions" id="actionsPreview" hidden>
        <button type="button" id="btnRerecord" class="btn btn-secondary">Re-record</button>
        <button type="button" id="btnPost" class="btn btn-primary">Post voice note</button>
      </div>

      <p id="recorderMsg" class="msg" role="status" aria-live="polite"></p>
    </section>

    <section class="card result" id="resultSection" hidden aria-labelledby="result-heading">
      <h2 id="result-heading">Voice note ready</h2>
      <p id="resultLead" class="result-lead" role="status" aria-live="polite">Adding it to your comment…</p>
      <!-- The note's address is kept only for copying; it is never shown. -->
      <input id="shareLink" class="vn-offscreen" type="text" readonly tabindex="-1" aria-hidden="true" />
      <div class="actions">
        <button type="button" id="btnInsert" class="btn btn-primary" hidden>Add to comment</button>
        <button type="button" id="btnCopy" class="btn btn-secondary" hidden>Copy voice note</button>
        <button type="button" id="btnAnother" class="btn btn-secondary">Record another</button>
      </div>
      <p id="copyMsg" class="msg ok" role="status" aria-live="polite"></p>
    </section>

    <footer class="footer">
      <p>Needs microphone permission. When embedded, the iframe must include <code>allow="microphone"</code>.</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
